<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2346D5">
<title>Arkaxhermes — Hermes Agent di Ubuntu proot</title>
<style>
/* ============================================================
   Arkaxhermes UI — mandiri, tanpa CDN.
   Terang  = Pastel Clay (DESIGN-2.md)
   Gelap   = Synthetica AI (DESIGN.md)
   ============================================================ */
:root{
  --font-size:14px;
  --canvas:#f0f4fc; --surface:#ffffff; --surface-2:#e6eefa; --surface-3:#f3f2ff;
  --text:#0e193e; --muted:#5b6076; --faint:#8b91a8;
  --primary:#4361ee; --primary-2:#8ea8ff; --primary-ink:#ffffff;
  --accent:#2346d5; --cyan:#0ea5b7; --ok:#1a9d6f; --warn:#d97706; --err:#d1435b;
  --border:rgba(35,62,130,.10); --hair:rgba(35,62,130,.16);
  --user:#e6eefa; --ai:#ffffff; --code:#0f1a3a; --code-text:#dbe6ff;
  --shadow:0 12px 28px rgba(35,62,130,.07), inset 0 2px 4px rgba(255,255,255,.9), inset 0 -3px 5px rgba(110,140,209,.10);
  --shadow-sm:0 6px 16px rgba(35,62,130,.08), inset 0 2px 3px rgba(255,255,255,.85);
  --radius:24px; --radius-sm:14px; --radius-xs:10px; --pill:999px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --canvas:#0b1326; --surface:#171f33; --surface-2:#131b2e; --surface-3:#222a3d;
  --text:#dae2fd; --muted:#c7c4d7; --faint:#8d92ab;
  --primary:#c0c1ff; --primary-2:#8083ff; --primary-ink:#1000a9;
  --accent:#8b5cf6; --cyan:#38bdf8; --ok:#34d399; --warn:#fbbf24; --err:#ffb4ab;
  --border:rgba(255,255,255,.08); --hair:rgba(255,255,255,.10);
  --user:#1e293b; --ai:rgba(30,41,59,.42); --code:#060e20; --code-text:#c7d2fe;
  --shadow:0 16px 36px -8px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.04);
  --shadow-sm:0 8px 22px -8px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03);
  --radius:16px; --radius-sm:10px; --radius-xs:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--canvas);color:var(--text);font-family:var(--font);font-size:var(--font-size);line-height:1.5}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(99,102,241,.10),transparent 60%)}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--primary)}
.phone{position:relative;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:86px;overflow:hidden;background:var(--canvas)}
.topbar{position:sticky;top:0;z-index:30;height:58px;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--canvas);background:color-mix(in srgb,var(--canvas) 86%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--pill);background:var(--surface);box-shadow:var(--shadow-sm);color:var(--text);flex:none}
.iconbtn:active{transform:scale(.94)}
.iconbtn.primary{background:var(--primary);color:var(--primary-ink);box-shadow:0 8px 20px -6px var(--primary)}
.provider-badge{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--pill);background:var(--surface);box-shadow:var(--shadow-sm)}
.provider-badge .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent);flex:none}
.provider-badge b{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.provider-badge small{display:block;font-size:10px;color:var(--faint);font-family:var(--mono)}
.chip-mini{font-size:10px;font-weight:800;padding:3px 8px;border-radius:var(--pill);background:var(--surface-2);color:var(--muted)}
.screen{padding:16px 14px 22px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tight{padding:12px}
.card.flat{box-shadow:none;background:var(--surface-2)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:var(--pill);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.err{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err)}
.tag.primary{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary)}
.mono{font-family:var(--mono);font-size:11px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:11.5px} .bold{font-weight:800}
.section-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin:20px 4px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:var(--pill);font-weight:700;font-size:12.5px;background:var(--surface-2);color:var(--text);box-shadow:var(--shadow-sm);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:var(--primary-ink);box-shadow:0 10px 24px -8px var(--primary)}
.btn.block{width:100%;padding:13px;font-size:13.5px}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--hair)}
.btn.danger{color:var(--err)}
.btn.sm{padding:7px 11px;font-size:11.5px}
.segmented{display:flex;gap:4px;padding:4px;border-radius:var(--pill);background:var(--surface-2)}
.segmented button{flex:1;padding:8px 4px;border-radius:var(--pill);font-size:12px;font-weight:700;color:var(--muted)}
.segmented button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
html[data-theme="dark"] .segmented button.on{background:var(--primary);color:var(--primary-ink)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{white-space:nowrap;padding:7px 13px;border-radius:var(--pill);font-size:11.5px;font-weight:700;background:var(--surface);color:var(--muted);box-shadow:var(--shadow-sm)}
.filters button.on{background:var(--primary);color:var(--primary-ink)}
.search{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--pill);background:var(--surface);box-shadow:var(--shadow-sm);margin-bottom:12px}
.search input{border:0;outline:0;background:transparent;flex:1;font-size:12.5px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface-2);border-radius:var(--radius-sm);padding:10px;text-align:center}
.stat b{display:block;font-size:15px;font-weight:800}
.stat small{font-size:10px;color:var(--muted)}
.bar{height:8px;border-radius:var(--pill);background:var(--surface-2);overflow:hidden;margin:8px 0}
.bar > i{display:block;height:100%;border-radius:var(--pill);background:linear-gradient(90deg,var(--primary),var(--primary-2))}
.list-item{display:flex;align-items:center;gap:11px;padding:12px;border-radius:var(--radius-sm);background:var(--surface-2);margin-bottom:8px}
.list-item .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface);color:var(--primary);flex:none}
.list-item b{font-size:12.5px} .list-item small{display:block;color:var(--muted);font-size:11px}
.switch{width:46px;height:26px;border-radius:var(--pill);background:var(--surface-3);border:1px solid var(--border);position:relative;flex:none;transition:.2s}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--faint);transition:.2s}
.switch.on{background:var(--primary)} .switch.on i{left:22px;background:var(--primary-ink)}
.kbd{font-family:var(--mono);font-size:10.5px;background:var(--surface-2);padding:3px 7px;border-radius:6px;color:var(--muted)}
/* Chat */
.chat-scroll{padding:14px 14px 4px;min-height:calc(100vh - 210px)}
.msg{display:flex;gap:9px;margin-bottom:14px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:14px}
.bubble{max-width:86%;padding:12px 14px;border-radius:18px;background:var(--ai);border:1px solid var(--border);box-shadow:var(--shadow-sm);font-size:var(--font-size);line-height:1.62}
.msg.user .bubble{background:var(--user);border-bottom-right-radius:5px}
.bubble .md h4{margin:8px 0 4px;font-size:13.5px}
.bubble .md ul{margin:6px 0;padding-left:18px}
.bubble .md code{font-family:var(--mono);font-size:11px;background:var(--surface-2);padding:2px 5px;border-radius:5px}
.code{background:var(--code);color:var(--code-text);border-radius:12px;margin:10px 0;overflow:hidden;font-family:var(--mono);font-size:11px}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(255,255,255,.06);font-size:10px}
.code-head button{color:var(--cyan);font-size:10px;font-weight:700}
.code pre{margin:0;padding:10px;white-space:pre-wrap;word-break:break-word}
.msg-meta{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--faint);font-size:10px;font-family:var(--mono)}
.msg-actions{display:flex;gap:4px;margin-top:6px}
.msg-actions button{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:var(--faint)}
.msg-actions button:active{background:var(--surface-2)}
.tools{margin-top:9px;border-top:1px dashed var(--border);padding-top:8px}
.tools .tool{display:flex;gap:6px;align-items:center;font-size:10.5px;font-family:var(--mono);color:var(--cyan);margin-bottom:3px}
.cursor{display:inline-block;width:7px;height:13px;background:var(--primary);vertical-align:-2px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.suggestions{display:flex;gap:7px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.suggestions::-webkit-scrollbar{display:none}
.suggestions button{white-space:nowrap;padding:8px 12px;border-radius:var(--pill);background:var(--surface);box-shadow:var(--shadow-sm);font-size:11.5px;font-weight:700;color:var(--muted)}
.composer{position:sticky;bottom:72px;z-index:20;padding:8px 12px;background:linear-gradient(to top,var(--canvas) 72%,transparent)}
.composer-inner{display:flex;align-items:flex-end;gap:6px;padding:7px 8px;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--border)}
.composer textarea{flex:1;border:0;outline:0;resize:none;background:transparent;max-height:110px;min-height:34px;padding:7px 4px;font-size:var(--font-size)}
.composer .send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:var(--primary-ink);flex:none}
.composer .send.off{background:var(--surface-2);color:var(--faint)}
.slash{position:absolute;left:12px;right:12px;bottom:78px;background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--shadow);border:1px solid var(--border);padding:6px;z-index:25}
.slash button{display:flex;width:100%;gap:8px;padding:8px 10px;border-radius:9px;text-align:left;font-size:12px}
.slash button:hover{background:var(--surface-2)}
/* Terminal */
.term{background:var(--code);color:var(--code-text);border-radius:var(--radius-sm);padding:12px;font-family:var(--mono);font-size:11px;line-height:1.65;height:340px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term .ok{color:var(--ok)} .term .warn{color:var(--warn)} .term .err{color:var(--err)} .term .dim{opacity:.6}
.term-input{display:flex;gap:8px;margin-top:10px}
.term-input input{flex:1;padding:11px 14px;border-radius:var(--pill);border:1px solid var(--border);background:var(--surface);outline:0;font-family:var(--mono);font-size:11.5px}
/* Nav & drawer */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);z-index:35;display:flex;justify-content:space-around;align-items:center;height:68px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--canvas);background:color-mix(in srgb,var(--canvas) 90%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--border)}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--faint);font-size:9.5px;font-weight:700;min-width:56px;position:relative}
.bottom-nav button.on{color:var(--primary)}
.bottom-nav button.on::after{content:"";position:absolute;bottom:-3px;width:5px;height:5px;border-radius:50%;background:var(--primary);box-shadow:0 0 10px var(--primary)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(6,10,24,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.22s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:max(0px,calc(50% - 215px));width:min(82%,340px);z-index:45;background:var(--surface);border-right:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer-head{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.drawer-body{flex:1;overflow-y:auto;padding:8px 10px 20px}
.drawer-group{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:12px 8px 6px}
.drawer-link{display:flex;align-items:center;gap:11px;width:100%;padding:10px;border-radius:12px;font-size:12.5px;font-weight:600;text-align:left}
.drawer-link.on{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.drawer-foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
/* Modal / install / toast */
.modal-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(6,10,24,.6);backdrop-filter:blur(4px)}
.modal{width:min(390px,100%);max-height:84vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.modal h3{margin:0 0 6px;font-size:17px;font-weight:800}
.field{margin:10px 0}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);outline:0;font-size:12.5px}
.field textarea{min-height:110px;font-family:var(--mono);font-size:11.5px;resize:vertical}
.modal-foot{display:flex;gap:8px;margin-top:14px}
.install-step{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.install-step:last-child{border:0}
.install-step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:10px;font-weight:800;background:var(--surface-2);color:var(--muted)}
.install-step.done .n{background:var(--ok);color:#fff} .install-step.active .n{background:var(--primary);color:var(--primary-ink)}
.toast{position:fixed;z-index:80;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--text);color:var(--canvas);padding:10px 16px;border-radius:var(--pill);font-size:11.5px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.28);transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.demo-badge{position:fixed;top:8px;right:calc(50% - 205px);z-index:50;font-size:9px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:var(--pill);background:var(--warn);color:#fff;box-shadow:var(--shadow-sm)}
@media(max-width:440px){.demo-badge{right:8px}}
.browser-stage{position:relative;background:#060e20;border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden;min-height:180px;display:grid;place-items:center}
.browser-stage img{display:block;width:100%;height:auto;max-height:58vh;object-fit:contain;touch-action:none;cursor:crosshair;background:#fff}
.browser-overlay{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.browser-overlay .tag{backdrop-filter:blur(8px)}
.browser-log{height:108px;overflow-y:auto;background:var(--code);color:var(--code-text);border-radius:12px;padding:9px;font-family:var(--mono);font-size:10px;line-height:1.55;white-space:pre-wrap}
.browser-url{display:flex;gap:6px;margin-bottom:10px}
.browser-url input{flex:1;padding:10px 12px;border-radius:var(--pill);border:1px solid var(--border);background:var(--surface);outline:0;font-family:var(--mono);font-size:11px}
.hidden{display:none!important}
</style>
</head>

async function api(path, method, body){
  method = method || 'GET';
  if(DEMO) return Demo.request(path, method, body);
  var headers = {'Content-Type':'application/json','X-Arkax-Token':TOKEN};
  var res = await fetch(API+path,{method:method,headers:headers,body:body && method!=='GET' ? JSON.stringify(body):undefined});
  if(!res.ok){ var t=await res.text(); throw new Error('HTTP '+res.status+': '+t.slice(0,180)); }
  return res.json();
}
async function feature(action, payload){
  if(DEMO) return Demo.feature(action, payload||{});
  return api('/api/hermes/feature','POST',{action:action,payload:payload||{}});
}
async function runArgv(argv, opts){
  if(DEMO) return Demo.request('/api/exec','POST',{argv:argv});
  return api('/api/exec','POST',Object.assign({argv:argv},opts||{}));
}
async function runShell(cmd){
  return runArgv(['/bin/bash','-lc',cmd]);
}
async function stream(path, body, onEvent){
  if(DEMO) return Demo.stream(path, body, onEvent);
  var res = await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','X-Arkax-Token':TOKEN},body:JSON.stringify(body||{})});
  if(!res.ok) throw new Error('SSE HTTP '+res.status);
  var reader=res.body.getReader(), dec=new TextDecoder(), buf='';
  while(true){
    var r=await reader.read(); if(r.done) break;
    buf += dec.decode(r.value,{stream:true});
    var blocks=buf.split('\n\n'); buf=blocks.pop();
    for(var j=0;j<blocks.length;j++){
      var ev='message',data='';
      blocks[j].split('\n').forEach(function(l){
        if(l.indexOf('event:')===0) ev=l.slice(6).trim();
        else if(l.indexOf('data:')===0) data+=l.slice(5).trim();
      });
      if(data){ try{ onEvent(ev,JSON.parse(data)); }catch(e){ onEvent('chunk',{text:data+'\n'}); } }
    }
  }
}
async function streamGet(path, onEvent){

function screenById(id){ for(var i=0;i<SCREENS.length;i++) if(SCREENS[i].id===id) return SCREENS[i]; return SCREENS[0]; }

/* ======================= 4. HELPERS ======================= */
function toast(msg){
  var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(state.toastTimer); state.toastTimer=setTimeout(function(){el.classList.remove('show');},2300);
}

function nativeCall(fn){ try{ return BRIDGE && BRIDGE[fn] ? BRIDGE[fn]() : null; }catch(e){ return null; } }
function applyFont(){ document.documentElement.style.setProperty('--font-size',state.font+'px'); }
function clearStoredState(){
  try{ localStorage.removeItem('arkax_messages'); }catch(e){}
  try{ if(BRIDGE && BRIDGE.secureDelete) BRIDGE.secureDelete('chat'); }catch(e){}
}
function persistState(){
  var payload = JSON.stringify({messages:state.messages,threadId:state.threadId,sessionId:state.sessionId});
  try{
    if(!state.settings || state.settings.autoSave===false){ clearStoredState(); return; }
    if(state.settings.encryptLocal && BRIDGE && BRIDGE.securePut){
      BRIDGE.securePut('chat',payload);
      try{ localStorage.removeItem('arkax_messages'); }catch(e){}
    } else {
      localStorage.setItem('arkax_messages',payload);
      try{ if(BRIDGE && BRIDGE.secureDelete) BRIDGE.secureDelete('chat'); }catch(e){}
    }
  }catch(e){ /* storage penuh: jangan gagalkan UI */ }
}
function restoreState(){
  var raw=null;
  try{
    if(state.settings && state.settings.encryptLocal && BRIDGE && BRIDGE.secureGet) raw=BRIDGE.secureGet('chat');
    if(!raw) raw=localStorage.getItem('arkax_messages');
    if(raw){
      var d=JSON.parse(raw);
      if(d && Array.isArray(d.messages) && d.messages.length){
        state.messages=d.messages;
        state.threadId=d.threadId||state.threadId;
        state.sessionId=d.sessionId||'';
      }
    }
  }catch(e){}
}
function haptic(kind){ if((state.settings && state.settings.haptics===false)) return; if(BRIDGE && BRIDGE.haptic) BRIDGE.haptic(kind||'light'); }
function btn(label,act,val,cls,pay){
  return '<button class="btn '+(cls||'')+'" data-act="'+attr(act)+'"'+(val!==undefined?' data-val="'+attr(val)+'"':'')+(pay?' data-pay="'+attr(JSON.stringify(pay))+'"':'')+'>'+label+'</button>';
}
function switchHtml(on,act,val){ return '<button class="switch '+(on?'on':'')+'" data-act="'+attr(act)+'" data-val="'+attr(val)+'" aria-label="toggle"><i></i></button>'; }
function md(text){
  var blocks=[];
  var s=esc(text||'');
  s=s.replace(/```(\w*)\n([\s\S]*?)```/g,function(m,lang,code){
    var i=blocks.length;
    blocks.push('<div class="code"><div class="code-head"><span>'+esc(lang||'kode')+'</span><button data-act="copy" data-val="'+attr(encodeURIComponent(code))+'">Salin</button></div><pre>'+esc(code)+'</pre></div>');
    return '\u0001B'+i+'\u0001';
  });
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>')
     .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
     .replace(/\*([^*]+)\*/g,'<em>$1</em>')
     .replace(/^### (.+)$/gm,'<h4>$1</h4>')
     .replace(/^- (.+)$/gm,'<li>$1</li>')
     .replace(/\n/g,'<br>');
  s=s.replace(/\u0001B(\d+)\u0001/g,function(m,i){return blocks[+i];});
  return s;
}
function setTheme(v){
  state.theme=v;
  var dark = v==='dark' || (v==='system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  state.resolved=dark?'dark':'light';
  document.documentElement.setAttribute('data-theme',state.resolved);
  var meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content',dark?'#0b1326':'#2346D5');
  if(BRIDGE && BRIDGE.setTheme) BRIDGE.setTheme(v);
  if(state.settings){ state.settings.theme=v; if(!DEMO) api('/api/settings','POST',{theme:v}).catch(function(){}); }
}

function normalizeFeatureItems(data, screenId){
  if(!data) return [];
  var arr;
  if(Array.isArray(data)) arr=data;
  else if(Array.isArray(data.toolsets)) arr=data.toolsets;
  else if(Array.isArray(data.hooks)) arr=data.hooks;
  else if(Array.isArray(data.localDecisions)) arr=data.localDecisions;
  else if(Array.isArray(data.suggestions)) arr=data.suggestions;
  else if(Array.isArray(data.bots)) arr=data.bots;
  else if(Array.isArray(data.files)) arr=data.files;
  else if(Array.isArray(data.directories)) arr=data.directories.map(function(d){return {name:d,meta:'Profil HERMES_HOME'};});
  else if(data.servers && !Array.isArray(data.servers)) arr=Object.keys(data.servers).map(function(k){return {name:k,meta:JSON.stringify(data.servers[k]).slice(0,100)};});
  else if(data.local && Array.isArray(data.local)) arr=data.local;
  else if(data.plugins && Array.isArray(data.plugins)) arr=data.plugins.map(function(x){return {name:String(x)};});
  else if(data.upstream && typeof data.upstream==='string') arr=[{name:'Output CLI',meta:data.upstream.slice(0,100)}];
  else return [];
  return arr.map(function(x){
    if(typeof x==='string') return {name:x,meta:'',tag:'Aktif'};
    return {
      id:x.id||x.name||x.path||x.file||x.title||'',
      name:x.name||x.title||x.id||x.path||x.file||String(x),
      meta:x.description||x.meta||x.schedule||x.state||x.model||x.when||x.command||x.path||'',
      tag:x.tag||x.risk||x.state||'Aktif',
      on:x.enabled!==undefined?x.enabled:(x.on!==undefined?x.on:true),
      configOnly:!!x.configOnly
    };
  });
}

function connectBrowserStream(){
  if(DEMO){ browserActivity('demo: WebSocket stream disimulasikan','dim'); return; }
  if(state.browser.ws && state.browser.ws.readyState<=1) return;
  var url='ws://127.0.0.1:'+state.browser.streamPort+'/?pacing=ack&maxFps=8';
  try{
    var ws=new WebSocket(url); state.browser.ws=ws;
    ws.onopen=function(){ state.browser.connected=true; browserActivity('stream tersambung: '+url,'ok'); browserWsSend({type:'config',pacing:'ack',maxFps:8}); if(state.screen==='browser') render(); };
    ws.onmessage=function(ev){
      var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      if(m.type==='frame'){
        state.browser.frame='data:image/jpeg;base64,'+m.data;
        state.browser.seq=m.seq||0;
        if(m.metadata){state.browser.viewW=m.metadata.deviceWidth||state.browser.viewW;state.browser.viewH=m.metadata.deviceHeight||state.browser.viewH;}
        updateBrowserFrame(); browserWsSend({type:'ack',seq:m.seq});
      } else if(m.type==='url'){ state.browser.url=m.url||state.browser.url; browserActivity('url → '+state.browser.url,'dim'); if(state.screen==='browser') render(); }
      else if(m.type==='status'){ state.browser.connected=!!m.connected; state.browser.screencasting=!!m.screencasting; state.browser.viewW=m.viewportWidth||state.browser.viewW; state.browser.viewH=m.viewportHeight||state.browser.viewH; if(state.screen==='browser') render(); }
      else if(m.type==='command'||m.type==='result'||m.type==='console'||m.type==='error'||m.type==='tab'){
        browserActivity('['+m.type+'] '+(m.text||m.action||m.url||JSON.stringify(m).slice(0,160)),m.type==='error'?'err':'');
      }
    };
    ws.onerror=function(){ browserActivity('stream error','err'); };
    ws.onclose=function(){ state.browser.connected=false; state.browser.ws=null; browserActivity('stream terputus','warn'); if(state.screen==='browser') render(); };
  }catch(e){ browserActivity('WebSocket gagal: '+e.message,'err'); }
}
function attachBrowserEvents(){
  var img=document.getElementById('browser-frame'); if(!img||!img.dataset||img.dataset.bound==='1') return;
  img.dataset.bound='1';
  function xy(e){
    var r=img.getBoundingClientRect();
    return {x:Math.round((e.clientX-r.left)/r.width*state.browser.viewW),y:Math.round((e.clientY-r.top)/r.height*state.browser.viewH)};
  }
  img.addEventListener('pointerdown',function(e){var p=xy(e);browserWsSend({type:'input_mouse',eventType:'mousePressed',x:p.x,y:p.y,button:'left',clickCount:1});});
  img.addEventListener('pointerup',function(e){var p=xy(e);browserWsSend({type:'input_mouse',eventType:'mouseReleased',x:p.x,y:p.y,button:'left'});});
  img.addEventListener('pointermove',function(e){if(e.buttons){var p=xy(e);browserWsSend({type:'input_mouse',eventType:'mouseMoved',x:p.x,y:p.y});}});
  img.addEventListener('wheel',function(e){var p=xy(e);browserWsSend({type:'input_mouse',eventType:'mouseWheel',x:p.x,y:p.y,deltaX:0,deltaY:Math.round(e.deltaY)});e.preventDefault();},{passive:false});
  img.addEventListener('keydown',function(e){browserWsSend({type:'input_keyboard',eventType:'keyDown',key:e.key,code:e.code});browserWsSend({type:'input_keyboard',eventType:'char',text:e.key.length===1?e.key:''});});
  img.tabIndex=0;
}

async function submitForm(action){
  var payload={};
  document.querySelectorAll('#arkax-form [data-k]').forEach(function(el){
    if(el.type==='checkbox') payload[el.getAttribute('data-k')]=el.checked;
    else payload[el.getAttribute('data-k')]=el.value;
  });
  if(action==='skills.write' && payload.name){
    payload.path='/root/.hermes/skills/'+payload.name.replace(/[^a-z0-9_-]/gi,'')+'/SKILL.md';
    payload.content='---\nname: '+payload.name+'\ndescription: Skill Arkaxhermes\n---\n\n'+(payload.content||'');
  }
  if(action==='mcp.add' && payload.args) payload.args=String(payload.args).split(/\s+/).filter(Boolean);
  if(action==='context.add') payload.recursive=/^(true|1|ya|on)$/i.test(String(payload.recursive||''));
  if(action==='cron.create'){
    if(payload.skill) payload.skills=[payload.skill];
    if(payload.noAgent && !payload.script){
      closeModal(); toast('No-agent membutuhkan --script di Hermes v0.23.1'); return;
    }
  }
  if(action==='hooks.set'){
    payload.event=payload.event||payload.name;
    payload.command=payload.command||payload.content;
    delete payload.content;
  }
  if(action==='batch.run' && payload.commands){
    payload.commands=String(payload.commands).split('\n').filter(Boolean);
  }
  if(action==='files.write' && payload.commands!==undefined){
    payload={commands:String(payload.commands).split('\n').filter(Boolean)}; action='batch.run';
  }
  if(action==='browser.command' && payload.url){ var br=await browserCommand(['open',payload.url],'open'); if(br)showOutput('Buka URL',br.stdout||br.stderr||''); closeModal(); return; }
  if(action==='exec'){ var r=await runShell(payload.cmd||'hermes doctor'); closeModal(); return showOutput('Hasil perintah',r.stdout||r.stderr); }
  if(action==='export.chat'){ payload.messages=state.messages.map(function(m){return {role:m.role,content:m.content};}); }
  if(action==='files.write' && payload.content===undefined && payload.path && payload.path.indexOf('.')<0){ payload.content=''; }
  try{
    var res=await feature(action,payload);
    closeModal();
    toast(res.ok===false ? ('Perlu Terminal: '+((res.warnings&&res.warnings[0])||res.error||'lihat fallback')) : (action+' berhasil · '+esc(res.source||'proot')));
    if(res.ok===false && res.fallback && res.fallback.argv){
      var rr=await runArgv(res.fallback.argv);
      showOutput(res.fallback.hint||'Fallback CLI',(rr.stdout||'')+(rr.stderr?'\n[stderr]\n'+rr.stderr:''));
    }
    loadFeatureFor(state.screen);
  }catch(e){ toast('Gagal: '+e.message); }
}

function startInstall(){
  if(DEMO){
    state.install={percent:0,message:'Menyiapkan …',done:0,log:[],finished:false}; renderOverlayOnly();
    var steps=[['Ekstrak rootfs Ubuntu',18],['Verifikasi SHA-256',34],['Pasang Python, Node & dependency',56],['Instal Hermes Agent v0.23.1',78],['hermes doctor',94],['Siap digunakan',100]];
    var i=0;
    var timer=setInterval(function(){
      if(!state.install){ clearInterval(timer); return; }
      if(i>=steps.length){ clearInterval(timer); state.install.finished=true; renderOverlayOnly(); toast('Instalasi demo selesai'); return; }
      state.install.message=steps[i][0]; state.install.percent=steps[i][1]; state.install.done=i;
      state.install.log.push('ARKAX: '+steps[i][0]); i++; renderOverlayOnly();
    },650);
    return;
  }
  state.install={percent:2,message:'Menghubungi installer …',done:0,log:[],finished:false}; renderOverlayOnly();
  api('/api/install','POST',{force:false}).catch(function(e){toast('Gagal memulai: '+e.message);});
  streamGet('/api/events',function(ev,d){
    if(!state.install) return;
    if(ev==='progress'){
      state.install.percent=Math.max(state.install.percent,d.percent||0);
      state.install.message=d.message||''; state.install.done=Math.min(5,Math.floor(state.install.percent/17));
      state.install.log.push(d.message||''); renderOverlayOnly();
    } else if(ev==='log'){ state.install.log.push(d.line||''); renderOverlayOnly(); }
    else if(ev==='error'){
      // Event 'error' membawa detail asli (mis. "Gagal mengekstrak rootfs: …").
      state.install.message=d.message||'Gagal'; state.install.percent=Math.max(state.install.percent,5);
      state.install.log.push('ERROR: '+(d.message||'tidak diketahui')); renderOverlayOnly();
    }
    else if(ev==='state'){
      if(d.state==='ready'){ state.install.percent=100; state.install.done=6; state.install.finished=true; state.install.message='Siap'; }
      if(d.state==='error'){ state.install.message=d.message||'Gagal'; }
      renderOverlayOnly();
      api('/api/status').then(function(s){state.status=s;}).catch(function(){});
    }
  }).catch(function(e){ toast('SSE putus: '+e.message); });
}

/* ======================= 7. CHAT ======================= */
function patchStream(){
  var last=state.messages[state.messages.length-1]; if(!last) return;
  var el=document.querySelector('[data-msg="'+(state.messages.length-1)+'"]');
  if(el) el.innerHTML=md(last.content)+'<span class="cursor"></span>';
  var c=document.getElementById('chat-scroll'); if(c) c.scrollTop=c.scrollHeight;
}
async function sendMessage(text){
  text=(text||'').trim(); if(!text||state.busy) return;
  if(text[0]==='/'){ handleSlash(text); state.composer=''; render(); return; }
  state.messages.push({role:'user',content:text});
  state.messages.push({role:'assistant',content:'',tokens:0,tools:[],streaming:true});
  state.composer=''; state.busy=true; state.slashOpen=false; render();
  haptic('light');
  try{
    await stream('/api/chat',{
      message:text,threadId:state.threadId,session:state.sessionId||null,
      toolsets:(state.settings&&state.settings.chat&&state.settings.chat.toolsets)||'web,terminal,skills',
      skills:[],yolo:false,safeMode:false,maxTurns:90
    },function(ev,d){
      var m=state.messages[state.messages.length-1];
      if(ev==='chunk') m.content+=(d.text||'');
      else if(ev==='tool') m.tools.push(d);
      else if(ev==='session') state.sessionId=d.id||state.sessionId;
      else if(ev==='done'){ m.streaming=false; m.tokens=d.tokens||Math.round(m.content.length/4); haptic('medium'); }
      else if(ev==='error'){ m.content+='\n\n⚠️ '+(d.message||'Terjadi kesalahan'); m.streaming=false; }
      else if(ev==='log'){ /* log ditampilkan di layar Log & Doctor */ }
      patchStream();
    });
  }catch(e){
    var m=state.messages[state.messages.length-1];
    m.content+='\n\n⚠️ Jembatan tidak dapat dihubungi: '+e.message; m.streaming=false;
  }finally{ state.busy=false; persistState(); render(); }
}
function handleSlash(cmd){
  var map={'/new':'Obrolan baru dibuat','/model':'Buka layar Portal untuk ganti model','/skills':'Buka layar Skills','/cron':'Buka Cron & Otomasi','/compress':'Konteks dikompresi','/usage':'1,42M / 5,00M token bulan ini','/stop':'Generasi dihentikan'};
  if(cmd==='/stop'){ if(!DEMO) api('/api/chat/stop','POST',{}).catch(function(){}); toast('Menghentikan …'); return; }
  if(cmd==='/new'){ state.messages=state.messages.slice(0,1); state.sessionId=''; state.threadId='t-'+Date.now().toString(36); }
  if(cmd==='/model'){ state.screen='portal'; }
  if(cmd==='/skills'){ state.screen='skills'; }
  if(cmd==='/cron'){ state.screen='cron'; }
  toast(map[cmd]||'Perintah diteruskan ke Hermes');
}
function regenerate(){
  var i=state.messages.length-2;
  var text=i>=0&&state.messages[i].role==='user'?state.messages[i].content:'';
  if(state.messages.length>1){ state.messages.pop(); }
  if(text) sendMessage(text);
}

async function termRun(){

  var cmd=input.value.trim(); if(!cmd) return;

  }catch(e){ state.terminal.push({t:'Error: '+e.message,c:'err'}); }

}
async function termTui(){

  }catch(e){ state.terminal.push({t:'TUI: '+e.message,c:'warn'}); }

}

});
window.__arkax={
  onFilePicked:function(d){ toast('Lampiran: '+d.name); state.composer=(state.composer+' [lampiran: '+d.path+']').trim(); render(); },
  onDictation:function(d){ state.composer=(state.composer+' '+d.text).trim(); render(); toast('Dikte diterima'); },
  onBackPressed:function(){ return state.drawer||!!state.modal; }
};

/* ======================= 10. BOOT ======================= */
async function boot(){
  var hash=(location.hash||'').replace('#/','');
  if(hash&&screenById(hash).id===hash) state.screen=hash;
  setTheme(state.theme);
  applyFont();
  if(DEMO){
    document.body.insertAdjacentHTML('afterbegin','<div class="demo-badge">MODE DEMO · PREVIEW</div>');
    state.status=await Demo.request('/api/status');
    state.settings=state.status.settings;
    restoreState();
    render();
    loadFeatureFor(state.screen);
    if(state.screen==='browser') browserStatus();
    return;
  }
  var info=null; try{ info=JSON.parse(BRIDGE.ready()); }catch(e){}
  try{
    var s=await api('/api/status');
    state.status=s; state.settings=s.settings||{};
    if(s.settings&&s.settings.theme) setTheme(s.settings.theme);
    if(s.settings&&s.settings.fontSize){ state.font=s.settings.fontSize; applyFont(); }
    restoreState();
    render();
    loadFeatureFor('provider'); loadFeatureFor('workspace'); loadFeatureFor(state.screen);
    if(state.screen==='browser'){ browserStatus(); connectBrowserStream(); }
    if(s.state!=='ready'){
      state.install={percent:0,message:'Ubuntu proot belum dipasang',done:0,log:[],finished:false};
      renderOverlayOnly();
    }
  }catch(e){
    toast('Server jembatan belum siap: '+e.message);
    render();
  }
}
boot();
})();
</script>
